name: Add to Project and Label Issues

on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    name: Add issue to Ignite GitHub Project
    runs-on: ubuntu-latest
    if: github.event.issue.state == 'open'
    steps:
      - name: Add to project
        uses: actions/add-to-project@v0.5.0
        with:
          project-url: ${{ vars.IGNITE_PROJECT_URL || 'https://github.com/orgs/microsoft/projects/TBD' }}
          github-token: ${{ secrets.ADD_TO_PROJECT_TOKEN }}

  label_issues:
    name: Apply labels to new issues
    runs-on: ubuntu-latest
    if: github.event.issue.state == 'open'
    permissions:
      issues: write
      contents: read
    steps:
      - name: Apply triage label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const issueNumber = context.issue.number;
            
            // Apply initial triage label
            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issueNumber,
              labels: ['needs-triage']
            });
            
            // Apply area labels based on title or body content
            const issue = context.payload.issue;
            const title = issue.title.toLowerCase();
            const body = issue.body ? issue.body.toLowerCase() : '';
            
            const labels = [];
            
            // Check for specific keywords and apply appropriate labels
            if (title.includes('bug') || body.includes('bug') || title.includes('error') || body.includes('error')) {
              labels.push('bug');
            }
            
            if (title.includes('feature') || body.includes('feature') || title.includes('enhancement')) {
              labels.push('enhancement');
            }
            
            if (title.includes('documentation') || title.includes('docs') || body.includes('documentation')) {
              labels.push('documentation');
            }
            
            if (title.includes('question') || body.includes('question') || title.includes('help')) {
              labels.push('question');
            }
            
            if (title.includes('teams') || body.includes('teams') || title.includes('microsoft teams')) {
              labels.push('teams');
            }
            
            if (title.includes('ai') || body.includes('ai') || title.includes('artificial intelligence')) {
              labels.push('ai');
            }
            
            if (title.includes('lab') || body.includes('lab') || title.includes('laboratory')) {
              labels.push('lab');
            }
            
            // Apply additional labels if any were identified
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issueNumber,
                labels: labels
              });
            }
            
            console.log(`Applied labels: needs-triage${labels.length > 0 ? ', ' + labels.join(', ') : ''}`);